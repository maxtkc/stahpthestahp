[project]
name = "stahpthestahp"
version = "0.2.0"
requires-python = ">=3.13"
description = "Ranks MBTA stops by the net weekday rider-hours of removing them"
license = "AGPL-3.0-or-later"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "polars>=1.0",
]

[project.scripts]
stahp = "stahpthestahp.cli:main"

[dependency-groups]
dev = [
    "commitizen",
    "deptry>=0.25.1",
    "pytest>=8.0",
    "ruff",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stahpthestahp"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests take fixtures by name and return nothing worth annotating.
"tests/**" = ["ANN"]

[tool.vulture]
paths = ["src", "tests"]
# Entry point named in [project.scripts]
ignore_names = ["main"]

[tool.deptry]
per_rule_ignores.DEP002 = [
    # Not imported yet
    "duckdb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
